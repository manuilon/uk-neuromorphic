name: Scrape news, events and network map

on:
  schedule:
    # 06:00 UTC daily
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Scrape events
        run: python3 scripts/scrape_events.py

      - name: Scrape news
        run: python3 scripts/scrape_news.py

      - name: Scrape NeuMat network map
        run: python3 scripts/scrape_network.py

      - name: Commit updated data
        run: |
          FILES="assets/events.json assets/news.json assets/network.json"
          git add $FILES
          if git diff --cached --quiet -- $FILES; then
            echo "No changes to data files"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Update news, events and network map"
          git push
